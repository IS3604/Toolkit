<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EditSimple Toolkit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: sticky header + search, filter rail, quick-access strip, category card grids. Admin view on #admin. */
:root{
  --brand:#C2410C; --cta:#FF571A; --soft:#FFF1EA;
  --ink:#211B17; --muted:#6B5D54; --faint:#A89A90;
  --bg:#FFFFFF; --card:#F8F5F1; --alt:#FFFAF6;
  --line:#ECE5DE; --line2:#DDD3CA;
  --ok:#047857; --okbg:#ECFDF5; --warn:#B45309; --warnbg:#FFFBEB; --dev:#57534E; --devbg:#F5F5F4; --bad:#DC2626;
  --display:'Geist',ui-sans-serif,system-ui,sans-serif; --body:'Geist',ui-sans-serif,system-ui,sans-serif; --mono:'Geist Mono',ui-monospace,monospace;
  --lift:0 10px 28px -10px rgba(33,27,23,.18),0 2px 6px -2px rgba(33,27,23,.06);
  --pop:0 24px 64px -12px rgba(33,27,23,.3);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;overflow-x:clip}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--body);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--cta);outline-offset:2px;border-radius:6px}
::selection{background:#FFD9C7}
.ic{width:1em;height:1em;flex:none;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.125em}
.wrap{max-width:1240px;margin:0 auto;padding:0 20px}
.hide{display:none!important}

/* header */
header{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.86);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.hrow{height:64px;display:flex;align-items:center;gap:16px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;flex:none}
.brand img{height:30px;width:auto;display:block}
.brand .sep{width:1px;height:20px;background:var(--line2)}
.brand b{font:600 15px var(--display);letter-spacing:-.01em}
.search{position:relative;flex:1;max-width:460px;margin:0 auto}
.search .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--faint);font-size:16px}
.search input{width:100%;height:40px;border:1px solid var(--line);background:var(--alt);border-radius:12px;padding:0 74px 0 36px;font-size:14px;transition:.15s}
.search input::placeholder{color:var(--faint)}
.search input:hover{border-color:var(--line2)}
.search input:focus{outline:none;border-color:var(--cta);background:#fff;box-shadow:0 0 0 4px rgba(255,87,26,.1)}
.search .keys{position:absolute;right:8px;top:50%;transform:translateY(-50%);display:flex;gap:3px}
.kbd{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 5px;border:1px solid var(--line);border-radius:5px;background:#fff;font:500 10px var(--mono);color:var(--muted)}
.hbtn{display:inline-flex;align-items:center;gap:6px;padding:8px 10px;border-radius:9px;color:var(--muted);font-weight:500;font-size:13px;text-decoration:none;transition:.15s}
.hbtn:hover{background:var(--card);color:var(--ink)}
.hbtn .ic{font-size:17px}
.mob-only{display:none}

/* hero */
.hero{position:relative;padding:44px 0 18px}
.hero:before{content:"";position:absolute;left:-40px;top:-30px;width:min(520px,100%);height:200px;background:radial-gradient(closest-side,#FFE7DB,transparent);opacity:.75;pointer-events:none}
.hero>*{position:relative}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;background:var(--soft);border:1px solid rgba(194,65,12,.15);color:var(--brand);font-size:12px;font-weight:500}
h1{font:600 40px/1.1 var(--display);letter-spacing:-.025em;margin:12px 0 6px;text-wrap:balance}
h1 em{font-style:normal;color:var(--brand)}
.tag{font-size:17px;color:var(--muted);margin:0}
.hero .search{margin:18px 0 0;max-width:none;display:none}

/* banners */
.banners{display:grid;gap:8px;margin:14px 0 6px}
.ban{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:12px;border:1px solid rgba(194,65,12,.15);background:var(--alt);animation:up .35s both}
.ban.maintenance{border-color:#FDE68A;background:var(--warnbg)}
.ban .bi{width:26px;height:26px;border-radius:7px;background:#fff;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--cta);flex:none}
.ban .bt{flex:1;min-width:0}
.ban .bt b{font-weight:600}.ban .bt span{color:var(--muted)}
.ban .blink{color:var(--cta);font-weight:500;margin-left:6px}
.ban .blink:hover{text-decoration:underline}
.ban .bx{color:var(--faint);font-size:16px;padding:2px}.ban .bx:hover{color:var(--ink)}
.note{margin:14px 0 0;padding:12px 14px;border-radius:12px;border:1px dashed #FCD34D;background:var(--warnbg);color:#92400E;font-size:13px}

/* filters */
.filters{position:sticky;top:64px;z-index:20;background:rgba(255,255,255,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:12px 0;margin:10px 0 20px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.chips::-webkit-scrollbar{display:none}
.chip{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;padding:6px 12px;border-radius:99px;border:1px solid var(--line);background:#fff;color:var(--muted);font-size:13px;font-weight:500;transition:.15s}
.chip:hover{border-color:var(--line2);color:var(--ink)}
.chip .n{font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}.chip.on .n{color:rgba(255,255,255,.6)}
.seg{display:inline-flex;gap:2px;padding:2px;border:1px solid var(--line);border-radius:10px;background:var(--alt);flex:none}
.seg button{padding:5px 10px;border-radius:8px;font-size:12px;font-weight:500;color:var(--muted)}
.seg button:hover{color:var(--ink)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 0 0 1px var(--line),0 1px 2px rgba(0,0,0,.04)}

/* sections */
.stack{display:grid;grid-template-columns:minmax(0,1fr);gap:44px;padding-bottom:72px}
.stack>*,.filters>*{min-width:0}
.sh{display:flex;align-items:flex-end;gap:12px;margin-bottom:14px}
.sh .si{width:28px;height:28px;border-radius:8px;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:15px}
.sh h2{font:600 18px/1.2 var(--display);letter-spacing:-.015em;margin:0}
.sh h2 small{font:400 13px var(--body);color:var(--faint);margin-left:8px}
.sh p{margin:0;font-size:12px;color:var(--faint)}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.qgrid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}

/* quick tabs */
.qtabs{display:flex;gap:4px;margin-bottom:12px;overflow-x:auto;scrollbar-width:none;align-items:center}
.qtabs button{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;padding:6px 12px;border-radius:9px;font-size:13px;font-weight:500;color:var(--muted)}
.qtabs button:hover{background:var(--card);color:var(--ink)}
.qtabs button.on{background:var(--soft);color:var(--brand)}
.qtabs .clr{margin-left:auto;font-size:12px;color:var(--faint);padding:4px 6px}
.empty{border:1px dashed var(--line2);border-radius:14px;padding:22px;text-align:center;color:var(--muted);font-size:13px}
.empty.big{padding:56px 20px;background:var(--alt)}
.empty.big b{display:block;color:var(--ink);font-size:15px;margin:8px 0 2px}

/* cards */
.card{position:relative;display:flex;flex-direction:column;padding:16px;border-radius:16px;border:1px solid var(--line);background:var(--card);cursor:pointer;transition:transform .2s,box-shadow .2s,border-color .2s,background .2s;animation:up .35s both;text-align:left}
.card:hover{transform:translateY(-2px);background:#fff;border-color:rgba(255,87,26,.3);box-shadow:var(--lift)}
.ctop{display:flex;gap:12px;align-items:flex-start}
.ico{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:var(--soft);border:1px solid rgba(194,65,12,.1);color:var(--brand);font-size:19px;flex:none;overflow:hidden}
.ico img{width:100%;height:100%;object-fit:cover;background:#fff}
.ico.dev{background:#fff;border-color:var(--line);color:var(--faint)}
.ico.sm{width:32px;height:32px;border-radius:9px;font-size:16px}
.ico.lg{width:56px;height:56px;border-radius:16px;font-size:26px}
.ctitle{flex:1;min-width:0;padding-top:1px}
.ctitle h3{margin:0;font:600 15px/1.3 var(--display);letter-spacing:-.01em;display:flex;gap:6px;align-items:flex-start}
.ctitle h3 span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.new{flex:none;margin-top:2px;background:var(--cta);color:#fff;font:600 10px/1 var(--body);letter-spacing:.04em;text-transform:uppercase;padding:3px 5px;border-radius:4px}
.host{font-size:12px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cact{display:flex;margin:-4px -6px 0 0}
.cact button{padding:6px;border-radius:7px;color:var(--faint);font-size:15px;opacity:0;transition:.15s}
.card:hover .cact button,.cact button:focus,.cact button.fav{opacity:1}
.cact button:hover{background:var(--card);color:var(--ink)}
.cact button.fav{color:var(--cta)}.cact button.fav .ic{fill:currentColor}
.cdesc{margin:12px 0 0;font-size:13px;line-height:20px;color:var(--muted);min-height:40px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cfoot{display:flex;align-items:center;gap:8px;margin-top:16px}
.ctag{background:#fff;border:1px solid var(--line);border-radius:6px;padding:1px 7px;font-size:11px;font-weight:500;color:var(--muted)}
.open{margin-left:auto;display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:500;color:var(--muted);transition:.15s}
.card:hover .open{color:var(--cta)}
.badge{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:500}
.badge:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.badge.active{background:var(--okbg);color:var(--ok)}.badge.beta{background:var(--warnbg);color:var(--warn)}.badge.under_development{background:var(--devbg);color:var(--dev)}
.mini{display:flex;align-items:center;gap:12px;padding:10px 12px 10px 10px;border-radius:12px;border:1px solid var(--line);background:#fff;text-align:left;transition:.2s;min-width:0}
.mini:hover{transform:translateY(-2px);border-color:rgba(255,87,26,.3);box-shadow:var(--lift)}
.mini .mt{flex:1;min-width:0}
.mini .mt b{display:block;font-weight:500;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini>.ic{color:var(--faint);font-size:15px}.mini:hover>.ic{color:var(--cta)}

/* palette & drawer & modal */
.ov{position:fixed;inset:0;z-index:50;background:rgba(33,27,23,.3);animation:fade .2s both}
.pal{position:fixed;z-index:51;left:50%;top:12vh;transform:translateX(-50%);width:min(580px,calc(100% - 32px));background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--pop);overflow:hidden;animation:up .25s both}
.pal .pi{display:flex;align-items:center;gap:12px;padding:0 16px;border-bottom:1px solid var(--line)}
.pal .pi .ic{color:var(--faint);font-size:18px}
.pal .pi input{flex:1;height:56px;border:0;outline:0;font-size:15px;background:none}
.pal .pl{max-height:50vh;overflow:auto;padding:8px}
.pal .ph{font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);padding:4px 8px}
.prow{display:flex;align-items:center;gap:12px;width:100%;padding:8px 10px;border-radius:12px;text-align:left}
.prow.on{background:var(--card)}
.prow .pt{flex:1;min-width:0}.prow .pt b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .go{font-size:12px;font-weight:500;color:var(--cta);display:none;align-items:center;gap:4px}
.prow.on .go{display:flex}
.pal .pf{display:flex;gap:16px;padding:10px 16px;border-top:1px solid var(--line);background:var(--alt);font-size:11px;color:var(--muted)}
.pal .pf span{display:flex;align-items:center;gap:4px}
.drawer{position:fixed;z-index:51;top:0;right:0;bottom:0;width:min(440px,100%);background:#fff;border-left:1px solid var(--line);box-shadow:var(--pop);display:flex;flex-direction:column;animation:slide .25s both}
.dh{display:flex;justify-content:space-between;align-items:center;padding:12px 20px;border-bottom:1px solid var(--line);font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.06em;color:var(--faint)}
.db{flex:1;overflow:auto;padding:24px 20px}
.db h2{font:600 21px/1.25 var(--display);letter-spacing:-.02em;margin:16px 0 8px}
.db p{color:var(--muted);line-height:1.65;margin:14px 0 0;white-space:pre-line}
.dl{margin:22px 0 0;border:1px solid var(--line);border-radius:12px}
.dl div{display:flex;gap:12px;align-items:center;padding:11px 14px;border-top:1px solid var(--line)}
.dl div:first-child{border-top:0}
.dl dt{width:76px;color:var(--faint);flex:none}.dl dd{margin:0;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:18px}
.tags span{background:var(--alt);border:1px solid var(--line);border-radius:6px;padding:1px 8px;font-size:12px;color:var(--muted)}
.df{display:flex;gap:8px;padding:16px;border-top:1px solid var(--line)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 14px;border-radius:10px;font-size:14px;font-weight:500;transition:.15s;text-decoration:none}
.btn .ic{font-size:16px}
.btn.p{background:var(--cta);color:#fff;box-shadow:0 1px 2px rgba(0,0,0,.08)}.btn.p:hover{background:var(--brand)}
.btn.o{border:1px solid var(--line);background:#fff}.btn.o:hover{border-color:var(--line2);background:var(--alt)}
.btn.g{color:var(--muted)}.btn.g:hover{background:var(--card);color:var(--ink)}
.btn.d{background:var(--bad);color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.ib{padding:7px}
.modal{position:fixed;z-index:51;left:50%;top:50%;transform:translate(-50%,-50%);width:min(640px,calc(100% - 24px));max-height:92vh;display:flex;flex-direction:column;background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--pop);animation:pop .25s both}
.modal.narrow{width:min(440px,calc(100% - 24px))}
.mh{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;border-bottom:1px solid var(--line)}
.mh h3{margin:0;font:600 16px var(--display)}
.mb{padding:20px;overflow:auto;display:grid;gap:16px;grid-template-columns:1fr 1fr}
.mb .full{grid-column:1/-1}
.mf{display:flex;justify-content:flex-end;gap:8px;padding:12px 20px;border-top:1px solid var(--line);background:var(--alt);border-radius:0 0 18px 18px}
label.l{display:block;font-size:12px;font-weight:500;color:var(--muted);margin-bottom:6px}
.inp{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:14px;background:#fff;transition:.15s}
.inp:focus{outline:none;border-color:var(--cta);box-shadow:0 0 0 4px rgba(255,87,26,.1)}
textarea.inp{resize:vertical;min-height:68px}
.mono{font-family:var(--mono);font-size:13px}
.ipick{display:grid;grid-template-columns:repeat(auto-fill,minmax(34px,1fr));gap:4px;max-height:132px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:6px}
.ipick button{aspect-ratio:1;border-radius:7px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:16px}
.ipick button:hover{background:var(--card);color:var(--ink)}
.ipick button.on{background:var(--soft);color:var(--brand);box-shadow:inset 0 0 0 1px rgba(194,65,12,.3)}
.iconrow{display:flex;gap:14px}
.iconrow .side{display:flex;flex-direction:column;align-items:center;gap:8px}
.hint{font-size:11px;color:var(--faint);margin:6px 0 0}
.tog{display:inline-flex;align-items:center;gap:10px;font-size:14px;cursor:pointer}
.tog i{position:relative;width:36px;height:20px;border-radius:99px;background:var(--line2);transition:.15s}
.tog i:after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:.15s}
.tog input{position:absolute;opacity:0;pointer-events:none}
.tog input:checked+i{background:var(--cta)}.tog input:checked+i:after{left:18px}
.err{color:var(--bad);font-size:13px;margin:0}
.toast{position:fixed;z-index:60;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-weight:500;box-shadow:var(--pop);animation:up .25s both}
.toast.bad{background:var(--bad)}

/* admin */
.atabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.atabs button{position:relative;display:inline-flex;align-items:center;gap:6px;padding:4px 12px 12px;font-weight:500;color:var(--muted);white-space:nowrap}
.atabs button small{color:var(--faint);font-size:12px}
.atabs button.on{color:var(--ink)}
.atabs button.on:after{content:"";position:absolute;left:8px;right:8px;bottom:0;height:2px;border-radius:2px;background:var(--cta)}
.abar{display:flex;gap:8px;align-items:center;margin:24px 0 14px;flex-wrap:wrap}
.abar .search{margin:0;max-width:none}
.abar .search input{padding-right:12px;background:#fff}
.abar select{width:auto;min-width:170px}
.abar p{margin:0;flex:1;color:var(--muted)}
.list{border:1px solid var(--line);border-radius:16px;background:#fff;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:11px 14px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row:hover{background:var(--alt)}
.mv{display:flex;flex-direction:column}
.mv button{color:var(--faint);padding:1px;font-size:14px}.mv button:hover{color:var(--ink)}.mv button:disabled{opacity:.2;cursor:default}
.rt{flex:1;min-width:0}
.rt b{font-weight:500;display:flex;gap:6px;align-items:center}
.rt b .ic{color:var(--cta);font-size:12px}
.rt a{font-size:12px;color:var(--faint);text-decoration:none;display:inline-flex;gap:4px;align-items:center}
.rt a:hover{color:var(--cta)}
.rc{width:130px;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rs{width:120px}.rn{width:52px;text-align:right;font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums}
.ra{display:flex}.ra button{padding:7px;border-radius:8px;color:var(--muted);font-size:15px}
.ra button:hover{background:var(--card);color:var(--ink)}.ra button.on{color:var(--cta)}.ra button.del:hover{color:var(--bad)}
.foot{font-size:12px;color:var(--faint);margin:8px 0 60px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin:24px 0 16px}
.tile{border:1px solid var(--line);border-radius:16px;background:#fff;padding:16px}
.tile p{margin:0;font-size:12px;color:var(--faint)}.tile b{display:block;font:600 26px var(--display);letter-spacing:-.02em;margin-top:4px;font-variant-numeric:tabular-nums}
.bars{border:1px solid var(--line);border-radius:16px;background:#fff;padding:18px;display:grid;gap:14px;margin-bottom:60px}
.bars h4{margin:0;font-size:14px}
.bar{display:flex;gap:12px;align-items:center}
.bar .bt{flex:1;min-width:0}
.bar .bl{display:flex;justify-content:space-between;gap:8px;font-size:13px}
.bar .bl span{color:var(--faint)}
.bar .track{height:6px;border-radius:99px;background:var(--card);margin-top:6px;overflow:hidden}
.bar .fill{height:100%;border-radius:99px;background:var(--cta)}
.akind{font-size:11px;font-weight:500;padding:2px 8px;border-radius:6px;flex:none;background:var(--devbg);color:var(--dev)}
.akind.launch{background:var(--soft);color:var(--brand)}.akind.maintenance{background:var(--warnbg);color:var(--warn)}
.locked{max-width:420px;margin:12vh auto;text-align:center;border:1px solid var(--line);border-radius:18px;padding:28px;box-shadow:var(--lift)}
.locked h2{font:600 18px var(--display);margin:0 0 6px}.locked p{color:var(--muted);margin:0 0 18px}
footer.f{border-top:1px solid var(--line);padding:22px;text-align:center;font-size:12px;color:var(--faint)}
.skel{height:132px;border-radius:16px;background:linear-gradient(90deg,var(--card),#FBF8F5,var(--card));background-size:200% 100%;animation:sh 1.2s infinite}

@keyframes up{from{opacity:.001;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:.001;transform:translate(-50%,-48%)}to{opacity:1;transform:translate(-50%,-50%)}}
@keyframes fade{from{opacity:0}}
@keyframes slide{from{transform:translateX(24px);opacity:.001}}
@keyframes sh{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

@media (max-width:760px){
  header .search{display:none}.mob-only{display:inline-flex}
  .hero{padding-top:28px}.hero .search{display:block}
  h1{font-size:32px}.tag{font-size:15px}
  .filters{position:static}
  .chips{flex-basis:100%}
  .hbtn span{display:none}
  .rc,.rn{display:none}.rs{width:auto}
  .mb{grid-template-columns:1fr}
  .modal{top:auto;bottom:0;transform:translateX(-50%);border-radius:18px 18px 0 0;width:100%;animation:fade .2s both}
  .mf{border-radius:0}
}
@media (max-width:480px){.rs{display:none}.wrap{padding:0 16px}}

h d=\"M15 3h6v6\"/><path d=\"M10 14 21 3\"/><path d=\"M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6\"/>","folder-tree":"<path d=\"M20 10a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1h-2.5a1 1 0 0 1-.8-.4l-.9-1.2A1 1 0 0 0 15 3h-2a1 1 0 0 0-1 1v5a1 1 0 0 0 1 1Z\"/><path d=\"M20 21a1 1 0 0 0 1-1v-3a1 1 0 0 0-1-1h-2.9a1 1 0 0 1-.88-.55l-.42-.85a1 1 0 0 0-.92-.6H13a1 1 0 0 0-1 1v5a1 1 0 0 0 1 1Z\"/><path d=\"M3 5a2 2 0 0 0 2 2h3\"/><path d=\"M3 3v13a2 2 0 0 0 2 2h3\"/>","layout-grid":"<rect width=\"7\" height=\"7\" x=\"3\" y=\"3\" rx=\"1\"/><rect width=\"7\" height=\"7\" x=\"14\" y=\"3\" rx=\"1\"/><rect width=\"7\" height=\"7\" x=\"14\" y=\"14\" rx=\"1\"/><rect width=\"7\" height=\"7\" x=\"3\" y=\"14\" rx=\"1\"/>","corner-down-left":"<polyline points=\"9 10 4 15 9 20\"/><path d=\"M20 4v7a4 4 0 0 1-4 4H4\"/>","copy":"<rect width=\"14\" height=\"14\" x=\"8\" y=\"8\" rx=\"2\" ry=\"2\"/><path d=\"M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2\"/>","check":"<path d=\"M20 6 9 17l-5-5\"/>","command":"<path d=\"M15 6v12a3 3 0 1 0 3-3H6a3 3 0 1 0 3 3V6a3 3 0 1 0-3 3h12a3 3 0 1 0-3-3\"/>","log-out":"<path d=\"M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4\"/><polyline points=\"16 17 21 12 16 7\"/><line x1=\"21\" x2=\"9\" y1=\"12\" y2=\"12\"/>"};
const PICK = ['box','captions','receipt','layout-dashboard','users','library','settings','briefcase','globe','wrench','shield','folder','film','video','image','file-text','book-open','chart-bar','chart-line','chart-pie','calendar','mail','message-square','palette','sparkles','zap','database','cloud','code','megaphone','clapperboard','music','scissors','wand-sparkles','clipboard-list','rocket','headphones','camera','layers','link'];
const STATUS = {active:'Active',beta:'Beta',under_development:'In development'};
const KIND = {launch:'New launch',maintenance:'Maintenance',info:'Update'};

const $ = (s,r=document)=>r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ic = n => `<svg class="ic" viewBox="0 0 24 24">${ICONS[n] || ICONS.box}</svg>`;
const host = u => { try { return new URL(u).hostname.replace(/^www\./,''); } catch { return u; } };
const safeUrl = u => /^https?:\/\//i.test(u||'') ? u : '#';
const isNew = r => r.createdAt && Date.now() - Date.parse(r.createdAt) < 14*864e5;
function hydrateIcons(root=document){ root.querySelectorAll('svg[data-i]').forEach(s=>{ s.innerHTML = ICONS[s.dataset.i]||''; s.removeAttribute('data-i'); }); }

/* ---------------- state ---------------- */
const S = {
  cats:[], res:[], ann:[], usage:{}, loaded:{cats:false,res:false,ann:false}, offline:false, timedOut:false,
  favs:[], recent:[], dismissed:[],
  q:'', cat:'all', status:'all', quick:null,
  view: location.hash === '#admin' ? 'admin' : 'home', atab:'resources', aq:'', acat:'all',
  canEdit:false, session:null, authErr:null, authBusy:false,
  modal:null, drawer:null, palette:null,
};
let sb=null;
const COLS={
  resources:{cols:['name','description','details','url','category_id','status','icon_name','icon_url','tags','is_pinned','sort_order'],map:{categoryId:'category_id',icon:'icon_name',iconData:'icon_url',pinned:'is_pinned',order:'sort_order',createdAt:'created_at',clicks:'click_count'}},
  categories:{cols:['name','slug','icon_name','sort_order'],map:{icon:'icon_name',order:'sort_order'}},
  announcements:{cols:['title','body','kind','resource_id','is_active'],map:{resourceId:'resource_id',active:'is_active',createdAt:'created_at'}},
};
function fromRow(col,row){ const o={...row}; for(const [k,v] of Object.entries(COLS[col].map)){ o[k]=row[v]; delete o[v]; } return o; }
function toRow(col,obj){ const r={}; const m=COLS[col].map; for(const [k,v] of Object.entries(obj)){ const key=m[k]||k; if(COLS[col].cols.includes(key)) r[key]=v; } return r; }

const catName = id => S.cats.find(c=>c.id===id)?.name;
const byId = id => S.res.find(r=>r.id===id);
const sortedRes = () => [...S.res].sort((a,b)=>(a.order??0)-(b.order??0) || a.name.localeCompare(b.name));
const sortedCats = () => [...S.cats].sort((a,b)=>(a.order??0)-(b.order??0));
const clicks = id => S.usage[id] || 0;

function search(list, q){
  q = q.trim().toLowerCase(); if(!q) return list;
  const terms = q.split(/\s+/);
  return list.map(r=>{
    const name = r.name.toLowerCase(), tags=(r.tags||[]).map(t=>String(t).toLowerCase());
    const hay = [r.description, tags.join(' '), host(r.url), r.details, catName(r.categoryId)].join(' ').toLowerCase();
    let s=0;
    for(const t of terms){
      if(name.startsWith(t)) s+=10; else if(name.split(/\W+/).some(w=>w.startsWith(t))) s+=7;
      else if(name.includes(t)) s+=5; else if(tags.some(x=>x.startsWith(t))) s+=4;
      else if(hay.includes(t)) s+=2; else return null;
    }
    return {r,s};
  }).filter(Boolean).sort((a,b)=>b.s-a.s || clicks(b.r.id)-clicks(a.r.id)).map(x=>x.r);
}

/* ---------------- per-browser prefs ---------------- */
const LS = { get(k,d){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch{ return d; } }, set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch{} } };
S.favs = LS.get('est:fav',[]); S.recent = LS.get('est:recent',[]); S.dismissed = LS.get('est:dismissed',[]);
function savePrefs(){ LS.set('est:fav',S.favs); LS.set('est:recent',S.recent); LS.set('est:dismissed',S.dismissed); }

/* ---------------- usage tracking ---------------- */
function track(id){
  S.usage[id]=(S.usage[id]||0)+1;
  if(sb) sb.rpc('track_click',{rid:id}).then(()=>{},()=>{});
}

function openRes(r){
  if(!r) return;
  const url = safeUrl(r.url);
  if(url==='#') return toast('This resource has no valid URL','bad');
  S.recent = [r.id, ...S.recent.filter(x=>x!==r.id)].slice(0,8);
  savePrefs(); track(r.id);
  // Plain anchor click — opens outside the page in a new tab.
  const a=document.createElement('a'); a.href=url; a.target='_blank'; a.rel='noopener noreferrer'; document.body.appendChild(a); a.click(); a.remove();
  render();
}
function toggleFav(id){
  S.favs = S.favs.includes(id) ? S.favs.filter(x=>x!==id) : [id, ...S.favs];
  savePrefs(); render(); renderLayer();
}

/* ---------------- render: home ---------------- */
const icoHtml = (r, size='') => r.iconData
  ? `<span class="ico ${size}"><img alt="" src="${esc(r.iconData)}"></span>`
  : `<span class="ico ${size} ${r.status==='under_development'?'dev':''}">${ic(r.icon)}</span>`;

function cardHtml(r,i=0){
  const fav=S.favs.includes(r.id);
  return `<div class="card" role="link" tabindex="0" data-open="${esc(r.id)}" style="animation-delay:${Math.min(i,12)*30}ms">
    <div class="ctop">${icoHtml(r)}
      <div class="ctitle"><h3><span>${esc(r.name)}</span>${isNew(r)?'<em class="new">New</em>':''}</h3><div class="host">${esc(host(r.url))}</div></div>
      <div class="cact"><button data-detail="${esc(r.id)}" aria-label="Details for ${esc(r.name)}">${ic('info')}</button><button class="${fav?'fav':''}" data-fav="${esc(r.id)}" aria-label="${fav?'Remove from':'Add to'} favorites">${ic('star')}</button></div>
    </div>
    <p class="cdesc">${esc(r.description||'No description yet.')}</p>
    <div class="cfoot">${catName(r.categoryId)?`<span class="ctag">${esc(catName(r.categoryId))}</span>`:''}${r.status!=='active'?`<span class="badge ${esc(r.status)}">${esc(STATUS[r.status]||r.status)}</span>`:''}<span class="open">Open ${ic('arrow-up-right')}</span></div>
  </div>`;
}
const miniHtml = r => `<button class="mini" data-open="${esc(r.id)}">${icoHtml(r,'sm')}<span class="mt"><b>${esc(r.name)}</b><span class="host">${esc(host(r.url))}</span></span>${ic('arrow-up-right')}</button>`;
const section = (title,icon,body,{sub,count,id}={}) => `<section ${id?`id="${esc(id)}"`:''}><div class="sh"><span class="si">${ic(icon)}</span><div><h2>${esc(title)}${count!=null?`<small>${count}</small>`:''}</h2>${sub?`<p>${esc(sub)}</p>`:''}</div></div>${body}</section>`;
const grid = list => `<div class="grid">${list.map(cardHtml).join('')}</div>`;

function renderHome(){
  const loading = !(S.loaded.cats && S.loaded.res);
  const res = sortedRes(), cats = sortedCats();
  const live = res.filter(r=>r.status!=='under_development');
  const counts={}; res.forEach(r=>{ counts[r.categoryId]=(counts[r.categoryId]||0)+1; });
  const anns = S.ann.filter(a=>a.active!==false && !S.dismissed.includes(a.id)).sort((a,b)=>String(b.createdAt).localeCompare(String(a.createdAt)));
  const filtering = S.q.trim() || S.cat!=='all' || S.status!=='all';

  let h = `<section class="hero">
    <span class="pill">${ic('sparkles')} ${loading?'Loading…':`${res.length} resources · ${cats.length} categories`}</span>
    <h1>EditSimple <em>Toolkit</em></h1>
    <p class="tag">Everything you need, all in one place.</p>
    <div class="search">${ic('search')}<input id="q2" type="search" autocomplete="off" placeholder="Search tools, dashboards, libraries…" aria-label="Search resources" value="${esc(S.q)}"></div>
  </section>`;

  if(S.offline) h += `<div class="note"><b>Not connected.</b> Add your Supabase URL and anon key at the top of <code>index.html</code>, then reload.</div>`;
  else if(S.loadErr) h += `<div class="note">Couldn't load the toolkit: ${esc(S.loadErr)}. Check that <code>schema.sql</code> has been run.</div>`;
  else if(S.timedOut && loading) h += `<div class="note">The toolkit list can't be reached yet. It will appear as soon as the connection answers.</div>`;

  if(anns.length) h += `<div class="banners">${anns.map(a=>{
    const linked = a.resourceId && byId(a.resourceId);
    const icon = a.kind==='maintenance'?'wrench':a.kind==='launch'?'megaphone':'sparkles';
    return `<div class="ban ${esc(a.kind)}"><span class="bi">${ic(icon)}</span><div class="bt"><b>${esc(a.title)}</b>${a.body?`<span> · ${esc(a.body)}</span>`:''}${linked?`<button class="blink" data-open="${esc(linked.id)}">Open ${esc(linked.name)} →</button>`:''}</div><button class="bx" data-dismiss="${esc(a.id)}" aria-label="Dismiss">${ic('x')}</button></div>`;
  }).join('')}</div>`;

  h += `<div class="filters"><div class="chips">
      <button class="chip ${S.cat==='all'?'on':''}" data-cat="all">All <span class="n">${res.length}</span></button>
      ${cats.map(c=>`<button class="chip ${S.cat===c.id?'on':''}" data-cat="${esc(c.id)}">${ic(c.icon||'folder')} ${esc(c.name)} <span class="n">${counts[c.id]||0}</span></button>`).join('')}
    </div>
    <div class="seg">${['all','active','beta','under_development'].map(s=>`<button class="${S.status===s?'on':''}" data-status="${s}">${s==='all'?'Any status':STATUS[s]}</button>`).join('')}</div>
  </div>`;

  if(loading){
    h += `<div class="grid" style="padding-bottom:72px">${'<div class="skel"></div>'.repeat(8)}</div>`;
    return h;
  }

  if(filtering){
    let list = res;
    if(S.cat!=='all') list = list.filter(r=>r.categoryId===S.cat);
    if(S.status!=='all') list = list.filter(r=>r.status===S.status);
    list = search(list,S.q);
    h += `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:12px"><p style="margin:0;color:var(--muted)">${list.length} ${list.length===1?'result':'results'}${S.q?` for “<b style="color:var(--ink);font-weight:500">${esc(S.q)}</b>”`:''}${S.q&&list[0]?` <span style="color:var(--faint);font-size:12px;margin-left:6px">Press <span class="kbd">↵</span> to open ${esc(list[0].name)}</span>`:''}</p><button class="btn g" data-act="clear" style="color:var(--cta)">Clear filters</button></div>`;
    h += list.length ? `<div style="padding-bottom:72px">${grid(list)}</div>` : `<div class="empty big" style="margin-bottom:72px">${ic('search')}<b>Nothing matches that search</b>Try another keyword, or clear the filters.</div>`;
    return h;
  }

  const lists = {
    favorites: S.favs.map(byId).filter(Boolean),
    recent: S.recent.map(byId).filter(Boolean),
    popular: [...live].sort((a,b)=>clicks(b.id)-clicks(a.id)).slice(0,8),
    new: [...res].sort((a,b)=>String(b.createdAt).localeCompare(String(a.createdAt))).slice(0,8),
  };
  const q = S.quick || (lists.favorites.length?'favorites':lists.recent.length?'recent':'popular');
  const tabs=[['favorites','star','Favorites'],['recent','clock','Recently opened'],['popular','flame','Most used'],['new','sparkles','Recently added']];
  const ql = lists[q];
  let body = `<div class="qtabs">${tabs.map(([k,i,l])=>`<button class="${q===k?'on':''}" data-quick="${k}">${ic(i)} ${l}</button>`).join('')}${q==='recent'&&ql.length?'<button class="clr" data-act="clear-recent">Clear</button>':''}</div>`;
  body += ql.length ? `<div class="qgrid">${ql.map(miniHtml).join('')}</div>` : `<div class="empty">${q==='favorites'?'Star any card to keep it here.':'Resources you open will show up here.'}</div>`;
  const parts = [`<section>${body}</section>`];

  const pinned = live.filter(r=>r.pinned);
  if(pinned.length) parts.push(section('Pinned','pin',grid(pinned),{sub:'Essentials picked by the team'}));
  for(const c of cats){
    const items = live.filter(r=>r.categoryId===c.id);
    if(items.length) parts.push(section(c.name,c.icon||'folder',grid(items),{count:items.length,id:c.id}));
  }
  const orphans = live.filter(r=>!S.cats.some(c=>c.id===r.categoryId));
  if(orphans.length) parts.push(section('Uncategorized','folder',grid(orphans),{count:orphans.length}));
  const soon = res.filter(r=>r.status==='under_development');
  if(soon.length) parts.push(section('Coming soon','construction',grid(soon),{sub:'Currently in development',count:soon.length}));
  if(!res.length) parts.push(`<div class="empty big">${ic('box')}<b>No resources yet</b>${S.canEdit?'Open Admin to add the first tool.':'Your admin hasn\'t added any tools yet.'}</div>`);
  return h + `<div class="stack">${parts.join('')}</div>`;
}

function paletteResults(){
  const q=S.palette.q;
  if(q.trim()) return search(S.res,q).slice(0,12);
  const seen=new Set(), out=[];
  for(const id of [...S.recent,...S.favs]){ const r=byId(id); if(r&&!seen.has(id)){ seen.add(id); out.push(r); } }
  for(const r of [...S.res].sort((a,b)=>clicks(b.id)-clicks(a.id))) if(!seen.has(r.id)){ seen.add(r.id); out.push(r); }
  return out.slice(0,10);
}
function renderPalette(){
  const L=$('#layer'), P=S.palette;
  if(!$('#pq')){
    L.innerHTML = `<div class="ov" data-act="close"></div><div class="pal" role="dialog" aria-modal="true" aria-label="Quick launch">
      <div class="pi">${ic('search')}<input id="pq" autocomplete="off" placeholder="Type a tool, dashboard or library to launch…" aria-label="Quick launch search"><span class="kbd">esc</span></div>
      <div class="pl" id="pl"></div>
      <div class="pf"><span><span class="kbd">↑</span><span class="kbd">↓</span> navigate</span><span><span class="kbd">↵</span> open in new tab</span></div></div>`;
    const inp=$('#pq'); inp.value=P.q; setTimeout(()=>inp.focus(),0);
  }
  const list=paletteResults(); P.list=list; P.i=Math.min(P.i,Math.max(0,list.length-1));
  $('#pl').innerHTML = (P.q?'':'<div class="ph">Suggested</div>') + (list.length ? list.map((r,i)=>`<button class="prow ${i===P.i?'on':''}" data-pi="${i}">${icoHtml(r,'sm')}<span class="pt"><b>${esc(r.name)}</b><span class="host">${esc(catName(r.categoryId)||'')} · ${esc(host(r.url))}</span></span><span class="go">Open ${ic('corner-down-left')}</span></button>`).join('') : `<p style="text-align:center;color:var(--muted);padding:32px 0;margin:0">No matches for “${esc(P.q)}”.</p>`);
  $('#pl').querySelector('.prow.on')?.scrollIntoView({block:'nearest'});
}

    <div class="full"><label class="l" for="f-name">Title</label><input class="inp" id="f-name" value="${esc(d.title)}" placeholder="Invoices v2 is live"></div>
    <div class="full"><label class="l" for="f-desc">Message (optional)</label><textarea class="inp" id="f-desc">${esc(d.body||'')}</textarea></div>

function readForm(){
  const d=S.modal.d, v=id=>document.getElementById(id)?.value;
  if(S.modal.type==='res'){ Object.assign(d,{name:v('f-name'),url:v('f-url'),description:v('f-desc'),categoryId:v('f-cat')||null,tags:(v('f-tags')||'').split(',').map(s=>s.trim().toLowerCase()).filter(Boolean),details:v('f-details'),pinned:$('#f-pin')?.checked||false}); }
  else if(S.modal.type==='cat'){ d.name=v('f-name'); }
  else { Object.assign(d,{title:v('f-name'),body:v('f-desc'),resourceId:v('f-link')||null}); }
}
const slug = s => (s||'').toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'').slice(0,40) || 'item';

async function saveModal(){
  readForm();
  const M=S.modal, d=M.d;
  const fail = m => { M.err=m; M.saving=false; renderModal(); };
  if(M.type==='res'){
    if(!d.name.trim()) return fail('Give the resource a name.');
    if(!/^https?:\/\/[^\s.]+\.[^\s]+/i.test(d.url.trim())) return fail('Enter a full URL starting with https://');
    d.name=d.name.trim(); d.url=d.url.trim(); d.description=(d.description||'').trim();
  } else if(M.type==='cat'){ if(!d.name.trim()) return fail('Give the category a name.'); d.name=d.name.trim(); if(!d.slug) d.slug=slug(d.name)+'-'+Math.random().toString(36).slice(2,6); }
  else { if(!d.title.trim()) return fail('Give the announcement a title.'); d.title=d.title.trim(); }
  const col = {res:'resources',cat:'categories',ann:'announcements'}[M.type];
  const row = toRow(col,d);
  M.saving=true; M.err=null; renderModal();
  const q = d.id ? sb.from(col).update(row).eq('id',d.id) : sb.from(col).insert(row);
  const { error } = await q;
  if(error) return fail(error.message || 'Couldn\'t save. Check that you are an admin.');
  S.modal=null; renderLayer(); toast(`${M.type==='res'?'Resource':M.type==='cat'?'Category':'Announcement'} saved`);
  refresh();
}

async function resizeImage(file){
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((ok,no)=>{ const i=new Image(); i.onload=()=>ok(i); i.onerror=no; i.src=url; });
    const s=128, c=document.createElement('canvas'); c.width=c.height=s;
    const g=c.getContext('2d'); g.fillStyle='#fff'; g.fillRect(0,0,s,s);
    const r=Math.min(s/img.width,s/img.height); const w=img.width*r, h=img.height*r;
    g.drawImage(img,(s-w)/2,(s-h)/2,w,h);
    return c.toDataURL('image/png');
  } finally { URL.revokeObjectURL(url); }
}

/* ---------------- admin actions ---------------- */
async function moveItem(kind,id,dir){
  const col = kind==='res'?'resources':'categories';
  let list = kind==='res' ? sortedRes() : sortedCats();
  if(kind==='res') list = list.filter(r=>(S.acat==='all'||r.categoryId===S.acat) && (!S.aq || `${r.name} ${r.url} ${r.description}`.toLowerCase().includes(S.aq.toLowerCase())));
  const i=list.findIndex(x=>x.id===id), j=i+dir; if(j<0||j>=list.length) return;
  const all = kind==='res'?sortedRes():sortedCats();
  const ids=all.map(x=>x.id); const a=ids.indexOf(list[i].id), b=ids.indexOf(list[j].id); [ids[a],ids[b]]=[ids[b],ids[a]];
  const changes = all.filter(x=>(x.order??0)!==ids.indexOf(x.id)+1);
  const src = kind==='res'?S.res:S.cats;
  changes.forEach(x=>{ const o=src.find(y=>y.id===x.id); o.order=ids.indexOf(x.id)+1; });
  render();
  for(const x of changes){ const {error}=await sb.from(col).update({sort_order:x.order}).eq('id',x.id); if(error){ toast('Couldn\'t save the new order','bad'); break; } }
}
async function quickUpdate(col,id,patch,msg){
  const {error}=await sb.from(col).update(toRow(col,patch)).eq('id',id);
  if(error) toast('Couldn\'t save that change','bad'); else if(msg) toast(msg);
}

let toastT;
function toast(msg,kind){ document.querySelector('.toast')?.remove(); const t=document.createElement('div'); t.className='toast'+(kind==='bad'?' bad':''); t.textContent=msg; document.body.appendChild(t); clearTimeout(toastT); toastT=setTimeout(()=>t.remove(),2400); }

/* ---------------- events ---------------- */
document.addEventListener('click', async e=>{
  const t=e.target.closest('[data-act],[data-open],[data-fav],[data-detail],[data-cat],[data-status],[data-quick],[data-dismiss],[data-atab],[data-mv],[data-pin],[data-edit],[data-editcat],[data-editann],[data-togann],[data-del],[data-pi],[data-copy],[data-ficon],[data-fstatus],[data-fkind]');
  if(!t) return;
  const ds=t.dataset;
  if(ds.fav){ e.stopPropagation(); return toggleFav(ds.fav); }
  if(ds.detail){ e.stopPropagation(); S.drawer=ds.detail; return renderLayer(); }
  if(ds.open){ const r=byId(ds.open); S.palette=null; S.drawer=null; renderLayer(); return openRes(r); }
  if(ds.pi){ const r=S.palette.list[+ds.pi]; S.palette=null; renderLayer(); return openRes(r); }
  if(ds.copy){ try{ await navigator.clipboard.writeText(ds.copy); toast('Link copied'); }catch{ toast('Copy isn\'t allowed here — select the URL instead','bad'); } return; }
  if(ds.cat){ S.cat=ds.cat; return render(); }
  if(ds.status){ S.status=ds.status; return render(); }
  if(ds.quick){ S.quick=ds.quick; return render(); }
  if(ds.dismiss){ S.dismissed=[...S.dismissed,ds.dismiss]; savePrefs(); return render(); }
  if(ds.atab){ S.atab=ds.atab; return render(); }
  if(ds.mv){ const [k,id,d]=ds.mv.split(':'); return moveItem(k,id,+d); }
  if(ds.pin){ const r=byId(ds.pin); r.pinned=!r.pinned; render(); return quickUpdate('resources',r.id,{pinned:r.pinned}, r.pinned?'Pinned':'Unpinned'); }
  if(ds.edit){ const r=byId(ds.edit); S.modal={type:'res',d:JSON.parse(JSON.stringify(r))}; return renderLayer(); }
  if(ds.editcat){ const c=S.cats.find(x=>x.id===ds.editcat); S.modal={type:'cat',d:{...c}}; return renderLayer(); }
  if(ds.editann){ const a=S.ann.find(x=>x.id===ds.editann); S.modal={type:'ann',d:{...a}}; return renderLayer(); }
  if(ds.togann){ const a=S.ann.find(x=>x.id===ds.togann); a.active=a.active===false; render(); return quickUpdate('announcements',a.id,{active:a.active}); }
  if(ds.del){
    const [k,id]=ds.del.split(':');
    const col={res:'resources',cat:'categories',ann:'announcements'}[k];
    const item=(k==='res'?S.res:k==='cat'?S.cats:S.ann).find(x=>x.id===id);
    const n = k==='cat' ? S.res.filter(r=>r.categoryId===id).length : 0;
    S.modal={type:'confirm',title:`Delete ${k==='res'?'resource':k==='cat'?'category':'announcement'}?`,
      html:`<b style="color:var(--ink)">${esc(item?.name||item?.title)}</b> will be removed for everyone.${n?` Its ${n} resource${n===1?'':'s'} will move to Uncategorized.`:''} This can't be undone.`,
      run: async()=>{ const {error}=await sb.from(col).delete().eq('id',id); if(error) toast('Couldn\'t delete: '+error.message,'bad'); else { toast('Deleted'); refresh(); } }};
    return renderLayer();
  }
  if(ds.ficon){ readForm(); S.modal.d.icon=ds.ficon; S.modal.d.iconData=null; return renderModal(); }
  if(ds.fstatus){ readForm(); S.modal.d.status=ds.fstatus; return renderModal(); }
  if(ds.fkind){ readForm(); S.modal.d.kind=ds.fkind; return renderModal(); }
  switch(ds.act){
    case 'palette': e.preventDefault(); S.palette={q:'',i:0}; return renderLayer();
    case 'close': S.palette=null; S.drawer=null; S.modal=null; return renderLayer();
    case 'confirm': { const run=S.modal.run; S.modal=null; renderLayer(); return run(); }
    case 'clear': S.q=''; S.cat='all'; S.status='all'; $('#q').value=''; return render();
    case 'clear-recent': S.recent=[]; savePrefs(); return render();
    case 'home': e.preventDefault(); location.hash=''; S.q=''; S.cat='all'; S.status='all'; $('#q').value=''; return route();
    case 'add-res': S.modal={type:'res',d:{name:'',url:'https://',description:'',details:'',categoryId:S.acat!=='all'?S.acat:(sortedCats()[0]?.id||null),status:'active',icon:'box',iconData:null,tags:[],pinned:false,order:(sortedRes().at(-1)?.order||0)+1}}; return renderLayer();
    case 'add-cat': S.modal={type:'cat',d:{name:'',icon:'folder',order:(sortedCats().at(-1)?.order||0)+1}}; return renderLayer();
    case 'add-ann': S.modal={type:'ann',d:{title:'',body:'',kind:'launch',resourceId:null,active:true}}; return renderLayer();
    case 'signout': await sb?.auth.signOut(); S.session=null; S.canEdit=false; location.hash=''; return route();
    case 'rm-icon': readForm(); S.modal.d.iconData=null; return renderModal();
  }
});
document.addEventListener('keydown', e=>{
  if(e.target.closest?.('.card') && e.key==='Enter' && e.target.dataset.open){ e.preventDefault(); openRes(byId(e.target.dataset.open)); return; }
  if((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==='k'){ e.preventDefault(); S.palette = S.palette?null:{q:'',i:0}; S.drawer=null; renderLayer(); return; }
  if(e.key==='Escape' && (S.palette||S.drawer||S.modal)){ S.palette=null; S.drawer=null; S.modal=null; renderLayer(); return; }
  if(e.key==='/' && !/INPUT|TEXTAREA|SELECT/.test(e.target.tagName) && S.view==='home'){ e.preventDefault(); (getComputedStyle($('#topSearch')).display!=='none'?$('#q'):$('#q2'))?.focus(); return; }
  if(S.palette && e.target.id==='pq'){
    const P=S.palette;
    if(e.key==='ArrowDown'){ e.preventDefault(); P.i=Math.min(P.i+1,P.list.length-1); renderPalette(); }
    else if(e.key==='ArrowUp'){ e.preventDefault(); P.i=Math.max(P.i-1,0); renderPalette(); }
    else if(e.key==='Enter'){ e.preventDefault(); const r=P.list[P.i]; S.palette=null; renderLayer(); openRes(r); }
    return;
  }
  if((e.target.id==='q'||e.target.id==='q2') && e.key==='Enter'){
    let list=S.res; if(S.cat!=='all') list=list.filter(r=>r.categoryId===S.cat); if(S.status!=='all') list=list.filter(r=>r.status===S.status);
    const top=search(list,S.q)[0]; if(S.q.trim() && top) openRes(top);
  }
  if((e.target.id==='q'||e.target.id==='q2') && e.key==='Escape'){ S.q=''; e.target.value=''; render(); }
});
document.addEventListener('mousemove', e=>{ const p=e.target.closest?.('[data-pi]'); if(p && S.palette && +p.dataset.pi!==S.palette.i){ S.palette.i=+p.dataset.pi; renderPalette(); } });
document.addEventListener('input', e=>{
  const id=e.target.id;
  if(id==='q'||id==='q2'){ S.q=e.target.value; if(id==='q2') $('#q').value=S.q; render(); if(id==='q2'){ const el=$('#q2'); el.focus(); el.setSelectionRange(el.value.length,el.value.length); } }
  else if(id==='pq'){ S.palette.q=e.target.value; S.palette.i=0; renderPalette(); }
  else if(id==='aq'){ S.aq=e.target.value; render(); }
});
document.addEventListener('change', async e=>{
  if(e.target.id==='acat'){ S.acat=e.target.value; render(); }
  if(e.target.id==='f-file' && e.target.files[0]){
    readForm();
    try{ S.modal.d.iconData = await resizeImage(e.target.files[0]); S.modal.err=null; }catch{ S.modal.err='That file couldn\'t be read as an image.'; }
    renderModal();
  }
});
document.addEventListener('submit', async e=>{
  if(e.target.id==='mform'){ e.preventDefault(); saveModal(); }
  if(e.target.id==='loginForm'){
    e.preventDefault();
    const email=$('#lg-email').value.trim(), password=$('#lg-pw').value;
    if(!email||!password){ S.authErr='Enter your email and password.'; return render(); }
    S.authBusy=true; S.authErr=null; render(); $('#lg-email').value=email;
    const {data,error}=await sb.auth.signInWithPassword({email,password});
    S.authBusy=false;
    if(error){ S.authErr=error.message; render(); $('#lg-email').value=email; return; }
    S.session=data.session; await checkAdmin(); render();
  }
});
function route(){ S.view = location.hash==='#admin' ? 'admin' : 'home'; window.scrollTo(0,0); render(); }
window.addEventListener('hashchange', route);

/* ---------------- data ---------------- */
async function refresh(){
  const [c,r,a] = await Promise.all([
    sb.from('categories').select('*').order('sort_order'),
    sb.from('resources').select('*').order('sort_order'),
    sb.from('announcements').select('*').order('created_at',{ascending:false}),
  ]);
  const err = c.error || r.error || a.error;
  S.loadErr = err ? err.message : null;
  S.cats = (c.data||[]).map(x=>fromRow('categories',x));
  S.res = (r.data||[]).map(x=>fromRow('resources',x));
  S.ann = (a.data||[]).map(x=>fromRow('announcements',x));
  S.usage = {}; S.res.forEach(x=>{ S.usage[x.id]=x.clicks||0; });
  S.loaded={cats:true,res:true,ann:true};
  render(); if(S.drawer||S.palette) renderLayer();
}
async function checkAdmin(){
  if(!S.session){ S.canEdit=false; return; }
  const {data}=await sb.rpc('is_admin'); S.canEdit=!!data;
}
async function start(){
  hydrateIcons(); render();
  if(!SUPABASE_URL || !SUPABASE_ANON_KEY || !window.supabase){ S.offline=true; S.loaded={cats:true,res:true,ann:true}; return render(); }
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const timer=setTimeout(()=>{ S.timedOut=true; render(); },10000);
  const {data:{session}} = await sb.auth.getSession(); S.session=session;
  await Promise.all([refresh(), checkAdmin()]); clearTimeout(timer); render();
  sb.auth.onAuthStateChange((_e,sess)=>{ S.session=sess; if(!sess){ S.canEdit=false; render(); } });
  // Live updates when anyone edits (needs Realtime enabled — schema.sql does this)
  let t; const bump=()=>{ clearTimeout(t); t=setTimeout(refresh,400); };
  sb.channel('toolkit')
    .on('postgres_changes',{event:'*',schema:'public',table:'resources'},bump)
    .on('postgres_changes',{event:'*',schema:'public',table:'categories'},bump)
    .on('postgres_changes',{event:'*',schema:'public',table:'announcements'},bump)
    .subscribe();
}
start();
</script>
